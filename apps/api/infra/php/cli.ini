; HElbaron API — CLI PHP overrides for the local dev / test container (php:8.3-cli).
;
; Why this file exists: the base php:8.3-cli image ships WITHOUT a loaded php.ini and only scans
; /usr/local/etc/php/conf.d, so the CLI runs at PHP's built-in memory_limit default of 128M. That
; OOMs `php artisan test` (Pest boots the whole suite in a single process) and other heavy artisan
; commands with "Allowed memory size of 134217728 bytes exhausted".
;
; It is COPYed into /usr/local/etc/php/conf.d/ by Dockerfile.dev, so the limit is baked into the
; image itself (it does not depend on a bind mount or a per-command `php -d memory_limit=...`).
; CI already pins the same 1G via shivammathur/setup-php (ini-values), and the production FPM image
; keeps its own tighter per-request budget in infra/php/php.ini — CLI and FPM are intentionally
; separate. Do NOT fold this into php.ini-development/php.ini-production.
memory_limit=1G
date.timezone=UTC
